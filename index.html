<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AliScore</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 18px;
    }

    button:active {
      transform: scale(0.98);
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>AliScore</header>

<div class="container">

  <button onclick="showTeams()">Takımlar</button>

  <div id="content"></div>

</div>

<script>
function showTeams() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>Takımlar</h2>
      <p>Takımlar burada görünecek.</p>
    </div>
  `;
}
</script>

</body>
</html>
