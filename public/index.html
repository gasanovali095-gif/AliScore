<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AliScore</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:#fff;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#0b1728;
    border-bottom:1px solid #20324b;
    padding:15px;
}

.logo{
    font-size:25px;
    font-weight:800;
    color:#28a9ff;
    margin-bottom:12px;
}

nav{
    display:flex;
    gap:7px;
    overflow-x:auto;
}

nav button{
    border:0;
    background:#14243a;
    color:#fff;
    padding:10px 15px;
    border-radius:9px;
    white-space:nowrap;
    cursor:pointer;
}

nav button.active{
    background:#1688dc;
}

main{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.page{display:none}
.page.active{display:block}

h1{
    margin-top:0;
}

.card{
    background:#0d1b2d;
    border:1px solid #20324b;
    border-radius:14px;
    padding:16px;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.team-card{
    background:#101f33;
    border:1px solid #243b59;
    border-radius:14px;
    padding:16px;
}

.team-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

button.primary{
    background:#1688dc;
    color:white;
    border:0;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
}

button.danger{
    background:#d9363e;
    color:#fff;
    border:0;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
}

button.yellow{
    background:#e4b400;
    color:#111;
    border:0;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
}

button.green{
    background:#159447;
    color:#fff;
    border:0;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
}

input,select{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:1px solid #334b68;
    background:#091525;
    color:white;
    margin:5px 0 10px;
}

label{
    display:block;
    margin-top:8px;
    color:#b9c8da;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:11px 7px;
    border-bottom:1px solid #24364d;
    text-align:center;
}

th{
    color:#7fc8ff;
}

.match{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;
    background:#101f33;
    padding:16px;
    border-radius:13px;
    margin-bottom:12px;
}

.team-left{text-align:right}
.team-right{text-align:left}

.score{
    font-size:23px;
    font-weight:bold;
}

.status{
    display:inline-block;
    padding:5px 8px;
    border-radius:6px;
    background:#273c55;
    font-size:12px;
}

.live{
    background:#c92835;
}

.lineup{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

.player{
    background:#101f33;
    border:1px solid #243b59;
    padding:12px;
    border-radius:10px;
}

.position{
    color:#58baff;
    font-size:12px;
}

.card-icon{
    display:inline-block;
    width:18px;
    height:25px;
    border-radius:3px;
    vertical-align:middle;
    margin-right:6px;
}

.card-yellow{background:#ffd400}
.card-red{background:#e51c2a}

.notice{
    background:#102f48;
    border-left:4px solid #1688dc;
    padding:12px;
    border-radius:8px;
    margin-bottom:10px;
}

.empty{
    text-align:center;
    color:#8294aa;
    padding:25px;
}

@media(max-width:600px){
    main{padding:12px}
    .match{grid-template-columns:1fr auto 1fr}
    th,td{font-size:13px;padding:8px 3px}
}
</style>
</head>

<body>

<header>
    <div class="logo">⚽ AliScore</div>

    <nav>
        <button class="nav active" data-page="home">Ana səhifə</button>
        <button class="nav" data-page="matches">Matçlar</button>
        <button class="nav" data-page="table">Turnir</button>
        <button class="nav" data-page="teams">Takımlar</button>
        <button class="nav" data-page="lineups">Heyətlər</button>
        <button class="nav" data-page="cards">Kartlar</button>
        <button class="nav" data-page="admin">İdarəetmə</button>
    </nav>
</header>

<main>

<!-- HOME -->
<section id="home" class="page active">
    <h1>AliScore</h1>

    <div id="notifications"></div>

    <div class="grid">
        <div class="card">
            <h2 id="homeTeams">0</h2>
            <div>Komandalar</div>
        </div>

        <div class="card">
            <h2 id="homeMatches">0</h2>
            <div>Matçlar</div>
        </div>

        <div class="card">
            <h2 id="homeGoals">0</h2>
            <div>Qollar</div>
        </div>
    </div>

    <div class="card">
        <h2>Son matçlar</h2>
        <div id="homeRecent"></div>
    </div>
</section>


<!-- MATCHES -->
<section id="matches" class="page">
    <h1>Matçlar</h1>
    <div id="matchesList"></div>
</section>


<!-- TABLE -->
<section id="table" class="page">
    <h1>Turnir cədvəli</h1>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Komanda</th>
                    <th>O</th>
                    <th>Q</th>
                    <th>H</th>
                    <th>M</th>
                    <th>GF</th>
                    <th>GA</th>
                    <th>GD</th>
                    <th>X</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>
        </table>
    </div>
</section>


<!-- TEAMS -->
<section id="teams" class="page">
    <h1>Takımlar</h1>

    <div id="teamsList" class="grid"></div>
</section>


<!-- LINEUPS -->
<section id="lineups" class="page">
    <h1>Start heyətləri</h1>

    <div class="card">
        <label>Komanda</label>
        <select id="lineupTeam"></select>
    </div>

    <div id="lineupList" class="lineup"></div>
</section>


<!-- CARDS -->
<section id="cards" class="page">
    <h1>Kartlar</h1>
    <div id="cardsList"></div>
</section>


<!-- ADMIN -->
<section id="admin" class="page">
    <h1>İdarəetmə</h1>

    <div class="card">
        <h2>Komanda əlavə et</h2>

        <input id="newTeamName" placeholder="Komanda adı">

        <button class="primary" onclick="addTeam()">
            Komanda əlavə et
        </button>
    </div>

    <div class="card">
        <h2>Matç əlavə et</h2>

        <label>Ev komandası</label>
        <select id="homeTeamSelect"></select>

        <label>Qonaq komandası</label>
        <select id="awayTeamSelect"></select>

        <label>Ev qolu</label>
        <input id="homeScore" type="number" value="0" min="0">

        <label>Qonaq qolu</label>
        <input id="awayScore" type="number" value="0" min="0">

        <label>Status</label>
        <select id="matchStatus">
            <option value="finished">Bitdi</option>
            <option value="live">CANLI</option>
            <option value="scheduled">Planlaşdırılıb</option>
        </select>

        <button class="primary" onclick="addMatch()">
            Matç əlavə et
        </button>
    </div>

    <div class="card">
        <h2>Oyunçu əlavə et</h2>

        <label>Komanda</label>
        <select id="playerTeam"></select>

        <input id="playerName" placeholder="Oyunçu adı">

        <label>Mövqe</label>
        <select id="playerPosition">
            <option>Qapıçı</option>
            <option>Müdafiəçi</option>
            <option>Yarımmüdafiəçi</option>
            <option>Hücumçu</option>
        </select>

        <button class="primary" onclick="addPlayer()">
            Oyunçu əlavə et
        </button>
    </div>

    <div class="card">
        <h2>Matça hadisə əlavə et</h2>

        <label>Matç</label>
        <select id="eventMatch"></select>

        <label>Komanda</label>
        <select id="eventTeam"></select>

        <label>Oyunçu</label>
        <select id="eventPlayer"></select>

        <label>Hadisə</label>
        <select id="eventType">
            <option value="goal">⚽ Qol</option>
            <option value="yellow">🟨 Sarı kart</option>
            <option value="red">🟥 Qırmızı kart</option>
        </select>

        <button class="primary" onclick="addEvent()">
            Hadisə əlavə et
        </button>
    </div>

    <div class="card">
        <h2>Məlumatlar</h2>
        <button class="danger" onclick="resetData()">
            Bütün məlumatları sıfırla
        </button>
    </div>
</section>

</main>

<script>

const API = "/api";

let state = {
    teams: [],
    matches: [],
    players: [],
    events: []
};


/* =========================
   API
========================= */

async function loadState(){

    try{

        const response = await fetch(API + "/state");

        if(!response.ok){
            throw new Error("Server xətası");
        }

        state = await response.json();

        if(!state.teams) state.teams=[];
        if(!state.matches) state.matches=[];
        if(!state.players) state.players=[];
        if(!state.events) state.events=[];

        renderAll();

    }catch(error){

        console.error(error);

        document.getElementById("notifications").innerHTML =
            `<div class="notice">
                Serverə qoşulmaq mümkün olmadı.
            </div>`;
    }
}


async function saveState(){

    try{

        await fetch(API + "/state",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(state)
        });

        renderAll();

    }catch(error){

        console.error(error);

        alert("Məlumat yadda saxlanmadı.");
    }
}


/* =========================
   NAVIGATION
========================= */

document.querySelectorAll(".nav").forEach(button=>{

    button.addEventListener("click",()=>{

        document.querySelectorAll(".nav")
            .forEach(x=>x.classList.remove("active"));

        document.querySelectorAll(".page")
            .forEach(x=>x.classList.remove("active"));

        button.classList.add("active");

        document
            .getElementById(button.dataset.page)
            .classList.add("active");

        renderAll();
    });

});


/* =========================
   TEAMS
========================= */

function addTeam(){

    const input = document.getElementById("newTeamName");

    const name = input.value.trim();

    if(!name){
        alert("Komanda adını yaz.");
        return;
    }

    state.teams.push({
        id:Date.now().toString(),
        name:name
    });

    input.value="";

    saveState();
}


function deleteTeam(id){

    if(!confirm("Bu komandanı silmək istəyirsən?")){
        return;
    }

    state.teams = state.teams.filter(t=>t.id!==id);

    state.players =
        state.players.filter(p=>p.teamId!==id);

    saveState();
}


function renderTeams(){

    const box = document.getElementById("teamsList");

    if(!state.teams.length){

        box.innerHTML =
            `<div class="empty">
                Hələ komanda yoxdur.
            </div>`;

        return;
    }

    box.innerHTML = state.teams.map(team=>{

        const players =
            state.players.filter(p=>p.teamId===team.id);

        return `
            <div class="team-card">

                <div class="team-name">
                    ⚽ ${escapeHtml(team.name)}
                </div>

                <div>
                    Oyunçu sayı:
                    <b>${players.length}</b>
                </div>

                <br>

                <button class="danger"
                    onclick="deleteTeam('${team.id}')">
                    Sil
                </button>

            </div>
        `;

    }).join("");
}


/* =========================
   PLAYERS
========================= */

function addPlayer(){

    const teamId =
        document.getElementById("playerTeam").value;

    const name =
        document.getElementById("playerName").value.trim();

    const position =
        document.getElementById("playerPosition").value;

    if(!teamId || !name){
        alert("Komanda və oyunçu adı lazımdır.");
        return;
    }

    state.players.push({
        id:Date.now().toString(),
        teamId,
        name,
        position,
        yellow:0,
        red:0,
        goals:0
    });

    document.getElementById("playerName").value="";

    saveState();
}


function renderPlayerSelects(){

    const selects = [
        "lineupTeam",
        "homeTeamSelect",
        "awayTeamSelect",
        "playerTeam",
        "eventTeam"
    ];

    selects.forEach(id=>{

        const select = document.getElementById(id);

        if(!select) return;

        const old = select.value;

        select.innerHTML = state.teams.map(team=>
            `<option value="${team.id}">
                ${escapeHtml(team.name)}
            </option>`
        ).join("");

        if(old && [...select.options].some(o=>o.value===old)){
            select.value=old;
        }
    });

    renderLineup();
    renderEventPlayers();
}


function renderLineup(){

    const teamId =
        document.getElementById("lineupTeam").value;

    const box =
        document.getElementById("lineupList");

    const players =
        state.players.filter(p=>p.teamId===teamId);

    if(!players.length){

        box.innerHTML =
            `<div class="empty">
                Bu komandanın oyunçuları yoxdur.
            </div>`;

        return;
    }

    const order = [
        "Qapıçı",
        "Müdafiəçi",
        "Yarımmüdafiəçi",
        "Hücumçu"
    ];

    const sorted = [...players].sort(
        (a,b)=>order.indexOf(a.position)-order.indexOf(b.position)
    );

    box.innerHTML = sorted.map(player=>`

        <div class="player">

            <div class="position">
                ${escapeHtml(player.position)}
            </div>

            <b>${escapeHtml(player.name)}</b>

            <div style="margin-top:8px">
                ⚽ ${player.goals || 0}
                &nbsp;
                🟨 ${player.yellow || 0}
                &nbsp;
                🟥 ${player.red || 0}
            </div>

        </div>

    `).join("");
}


document.getElementById("lineupTeam")
    .addEventListener("change",renderLineup);


/* =========================
   MATCHES
========================= */

function addMatch(){

    const home =
        document.getElementById("homeTeamSelect").value;

    const away =
        document.getElementById("awayTeamSelect").value;

    const homeScore =
        Number(document.getElementById("homeScore").value)||0;

    const awayScore =
        Number(document.getElementById("awayScore").value)||0;

    const status =
        document.getElementById("matchStatus").value;

    if(!home || !away){

        alert("İki komanda seç.");

        return;
    }

    if(home===away){

        alert("Eyni komanda ilə matç yaratmaq olmaz.");

        return;
    }

    state.matches.unshift({

        id:Date.now().toString(),

        homeTeam:home,

        awayTeam:away,

        homeScore,

        awayScore,

        status,

        date:new Date().toISOString()

    });

    saveState();
}


function teamName(id){

    const team =
        state.teams.find(t=>t.id===id);

    return team ? team.name : "Naməlum";
}


function renderMatches(){

    const box =
        document.getElementById("matchesList");

    if(!state.matches.length){

        box.innerHTML =
            `<div class="empty">
                Hələ matç yoxdur.
            </div>`;

        return;
    }

    box.innerHTML = state.matches.map(match=>{

        const statusText =
            match.status==="live"
            ? "CANLI"
            : match.status==="scheduled"
            ? "PLAN"
            : "BİTDİ";

        return `

            <div class="match">

                <div class="team-left">
                    <b>${escapeHtml(teamName(match.homeTeam))}</b>
                </div>

                <div style="text-align:center">

                    <span class="status ${
                        match.status==="live" ? "live" : ""
                    }">
                        ${statusText}
                    </span>

                    <div class="score">
                        ${match.homeScore} - ${match.awayScore}
                    </div>

                    <small>
                        ${formatDate(match.date)}
                    </small>

                </div>

                <div class="team-right">
                    <b>${escapeHtml(teamName(match.awayTeam))}</b>
                </div>

            </div>
        `;

    }).join("");
}


/* =========================
   TABLE
========================= */

function getTable(){

    return state.teams.map(team=>{

        const row = {
            team,
            played:0,
            win:0,
            draw:0,
            loss:0,
            gf:0,
            ga:0,
            points:0
        };

        state.matches.forEach(match=>{

            if(match.status==="scheduled") return;

            if(
                match.homeTeam!==team.id &&
                match.awayTeam!==team.id
            ){
                return;
            }

            const home =
                Number(match.homeScore)||0;

            const away =
                Number(match.awayScore)||0;

            row.played++;

            if(match.homeTeam===team.id){

                row.gf += home;
                row.ga += away;

                if(home>away){
                    row.win++;
                    row.points+=3;
                }
                else if(home===away){
                    row.draw++;
                    row.points++;
                }
                else{
                    row.loss++;
                }

            }else{

                row.gf += away;
                row.ga += home;

                if(away>home){
                    row.win++;
                    row.points+=3;
                }
                else if(away===home){
                    row.draw++;
                    row.points++;
                }
                else{
                    row.loss++;
                }

            }

        });

        row.gd = row.gf-row.ga;

        return row;

    }).sort((a,b)=>{

        if(b.points!==a.points)
            return b.points-a.points;

        if(b.gd!==a.gd)
            return b.gd-a.gd;

        return b.gf-a.gf;
    });
}


function renderTable(){

    const rows = getTable();

    const body =
        document.getElementById("tableBody");

    if(!rows.length){

        body.innerHTML =
            `<tr>
                <td colspan="10">Komanda yoxdur</td>
            </tr>`;

        return;
    }

    body.innerHTML = rows.map((row,index)=>`

        <tr>

            <td>${index+1}</td>

            <td style="text-align:left">
                <b>${escapeHtml(row.team.name)}</b>
            </td>

            <td>${row.played}</td>
            <td>${row.win}</td>
            <td>${row.draw}</td>
            <td>${row.loss}</td>
            <td>${row.gf}</td>
            <td>${row.ga}</td>
            <td>${row.gd}</td>
            <td><b>${row.points}</b></td>

        </tr>

    `).join("");
}


/* =========================
   EVENTS
========================= */

function renderEventMatches(){

    const select =
        document.getElementById("eventMatch");

    select.innerHTML = state.matches.map(match=>`

        <option value="${match.id}">
            ${teamName(match.homeTeam)}
            ${match.homeScore}-${match.awayScore}
            ${teamName(match.awayTeam)}
        </option>

    `).join("");
}


function renderEventPlayers(){

    const teamId =
        document.getElementById("eventTeam").value;

    const select =
        document.getElementById("eventPlayer");

    const players =
        state.players.filter(p=>p.teamId===teamId);

    select.innerHTML = players.map(player=>
        `<option value="${player.id}">
            ${escapeHtml(player.name)}
        </option>`
    ).join("");
}


document.getElementById("eventTeam")
    .addEventListener("change",renderEventPlayers);


function addEvent(){

    const matchId =
        document.getElementById("eventMatch").value;

    const teamId =
        document.getElementById("eventTeam").value;

    const playerId =
        document.getElementById("eventPlayer").value;

    const type =
        document.getElementById("eventType").value;

    if(!matchId || !teamId || !playerId){

        alert("Matç, komanda və oyunçu seç.");

        return;
    }

    const match =
        state.matches.find(m=>m.id===matchId);

    const player =
        state.players.find(p=>p.id===playerId);

    if(!match || !player) return;

    if(type==="goal"){

        if(match.homeTeam===teamId){
            match.homeScore++;
        }
        else if(match.awayTeam===teamId){
            match.awayScore++;
        }
        else{
            alert("Bu komanda həmin matçda deyil.");
            return;
        }

        player.goals=(player.goals||0)+1;
    }

    if(type==="yellow"){

        player.yellow=(player.yellow||0)+1;
    }

    if(type==="red"){

        player.red=(player.red||0)+1;
    }

    state.events.push({

        id:Date.now().toString(),

        matchId,

        teamId,

        playerId,

        type,

        date:new Date().toISOString()

    });

    saveState();

    sendNotification(
        type==="goal"
        ? "⚽ QOL!"
        : type==="yellow"
        ? "🟨 Sarı kart"
        : "🟥 Qırmızı kart"
    );
}


/* =========================
   CARDS
========================= */

function renderCards(){

    const box =
        document.getElementById("cardsList");

    const cards =
        state.events.filter(
            e=>e.type==="yellow" || e.type==="red"
        ).reverse();

    if(!cards.length){

        box.innerHTML =
            `<div class="empty">
                Hələ kart yoxdur.
            </div>`;

        return;
    }

    box.innerHTML = cards.map(event=>{

        const player =
            state.players.find(p=>p.id===event.playerId);

        const icon =
            event.type==="yellow"
            ? `<span class="card-icon card-yellow"></span>`
            : `<span class="card-icon card-red"></span>`;

        return `

            <div class="card">

                ${icon}

                <b>
                    ${escapeHtml(player ? player.name : "Oyunçu")}
                </b>

                <div style="margin-top:5px">
                    ${escapeHtml(teamName(event.teamId))}
                </div>

            </div>
        `;

    }).join("");
}


/* =========================
   HOME
========================= */

function renderHome(){

    document.getElementById("homeTeams").textContent =
        state.teams.length;

    document.getElementById("homeMatches").textContent =
        state.matches.length;

    const goals =
        state.matches.reduce(
            (sum,m)=>sum+
            Number(m.homeScore||0)+
            Number(m.awayScore||0),
            0
        );

    document.getElementById("homeGoals").textContent =
        goals;

    const recent =
        document.getElementById("homeRecent");

    const matches =
        state.matches.slice(0,5);

    if(!matches.length){

        recent.innerHTML =
            `<div class="empty">Matç yoxdur.</div>`;

        return;
    }

    recent.innerHTML = matches.map(m=>`

        <div class="notice">

            <b>${escapeHtml(teamName(m.homeTeam))}</b>

            ${m.homeScore}

            -

            ${m.awayScore}

            <b>${escapeHtml(teamName(m.awayTeam))}</b>

        </div>

    `).join("");
}


/* =========================
   NOTIFICATIONS
========================= */

function sendNotification(title){

    if("Notification" in window){

        if(Notification.permission==="granted"){

            new Notification(title,{
                body:"AliScore-da yeni hadisə baş verdi."
            });

        }
    }
}


async function enableNotifications(){

    if(!("Notification" in window)){

        alert("Bu brauzer bildirişləri dəstəkləmir.");

        return;
    }

    const permission =
        await Notification.requestPermission();

    if(permission==="granted"){

        sendNotification("AliScore aktivdir");

    }
}


/* =========================
   RENDER
========================= */

function renderAll(){

    renderHome();

    renderMatches();

    renderTable();

    renderTeams();

    renderPlayerSelects();

    renderEventMatches();

    renderCards();

    updateTeamSelects();
}


function updateTeamSelects(){

    const selects=[
        "homeTeamSelect",
        "awayTeamSelect",
        "playerTeam",
        "lineupTeam",
        "eventTeam"
    ];

    selects.forEach(id=>{

        const el=document.getElementById(id);

        if(!el) return;

        const current=el.value;

        el.innerHTML=state.teams.map(t=>
            `<option value="${t.id}">
                ${escapeHtml(t.name)}
            </option>`
        ).join("");

        if(
            current &&
            [...el.options].some(o=>o.value===current)
        ){
            el.value=current;
        }

    });

    renderLineup();
    renderEventPlayers();
}


/* =========================
   RESET
========================= */

async function resetData(){

    if(!confirm(
        "Bütün AliScore məlumatları silinəcək. Davam edilsin?"
    )){
        return;
    }

    state={
        teams:[],
        matches:[],
        players:[],
        events:[]
    };

    await saveState();
}


/* =========================
   HELPERS
========================= */

function formatDate(date){

    if(!date) return "";

    return new Date(date).toLocaleString(
        "az-AZ",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   START
========================= */

loadState();

setInterval(loadState,10000);

</script>
