<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AliScore</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tabs button {
      border: 0;
      background: #e5e7eb;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .tabs button.active {
      background: #111827;
      color: white;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    th,
    td {
      padding: 11px 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    th {
      background: #111827;
      color: white;
      font-size: 13px;
    }

    td:nth-child(2),
    th:nth-child(2) {
      text-align: left;
    }

    .admin-box {
      max-width: 500px;
      margin: auto;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      margin: 5px 0 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
    }

    .primary {
      width: 100%;
      border: 0;
      background: #111827;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    .danger {
      border: 0;
      background: #dc2626;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
    }

    .edit {
      border: 0;
      background: #2563eb;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
    }

    .save {
      border: 0;
      background: #16a34a;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
    }

    .logout {
      border: 0;
      background: #6b7280;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .team-editor {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
    }

    .stats-grid label {
      font-size: 12px;
      color: #555;
    }

    .stats-grid input {
      margin-top: 3px;
    }

    .match-row {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .match-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    @media (max-width: 700px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      table {
        font-size: 13px;
      }

      th,
      td {
        padding: 8px 4px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ AliScore</h1>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" data-tab="teams">
      Komandalar
    </button>

    <button class="tab" data-tab="table">
      Turnir cədvəli
    </button>

    <button class="tab" data-tab="matches">
      Matçlar
    </button>

    <button class="tab" data-tab="admin">
      Admin
    </button>
  </div>

  <!-- ================= TEAMS ================= -->

  <section id="teams" class="section active">

    <div class="card">
      <h2>Komandalar</h2>

      <div id="teamsList">
        Yüklənir...
      </div>
    </div>

  </section>

  <!-- ================= TABLE ================= -->

  <section id="table" class="section">

    <div class="card">
      <h2>Turnir cədvəli</h2>

      <div style="overflow-x:auto;">

        <table>

          <thead>
            <tr>
              <th>#</th>
              <th>Komanda</th>
              <th>O</th>
              <th>Q</th>
              <th>B</th>
              <th>M</th>
              <th>AV</th>
              <th>X</th>
            </tr>
          </thead>

          <tbody id="standings">
          </tbody>

        </table>

      </div>
    </div>

  </section>

  <!-- ================= MATCHES ================= -->

  <section id="matches" class="section">

    <div class="card">

      <h2>Matçlar</h2>

      <div id="matchesList">
        Yüklənir...
      </div>

    </div>

  </section>

  <!-- ================= ADMIN ================= -->

  <section id="admin" class="section">

    <!-- LOGIN -->

    <div id="loginBox" class="card admin-box">

      <h2>Admin girişi</h2>

      <input
        type="password"
        id="password"
        placeholder="Şifrə"
      >

      <button
        class="primary"
        onclick="login()"
      >
        Daxil ol
      </button>

      <p id="loginError"></p>

    </div>

    <!-- ADMIN PANEL -->

    <div
      id="adminPanel"
      class="hidden"
    >

      <!-- TEAMS ADMIN -->

      <div class="card">

        <h2>Komandaları idarə et</h2>

        <div id="adminTeams">
        </div>

      </div>

      <!-- ADD TEAM -->

      <div class="card">

        <h2>Yeni komanda</h2>

        <input
          id="newTeamName"
          placeholder="Komanda adı"
        >

        <div class="stats-grid">

          <div>
            <label>O</label>
            <input id="newPlayed" type="number" value="0">
          </div>

          <div>
            <label>Q</label>
            <input id="newWins" type="number" value="0">
          </div>

          <div>
            <label>B</label>
            <input id="newDraws" type="number" value="0">
          </div>

          <div>
            <label>M</label>
            <input id="newLosses" type="number" value="0">
          </div>

          <div>
            <label>AV</label>
            <input id="newGoalDifference" type="number" value="0">
          </div>

          <div>
            <label>X</label>
            <input id="newPoints" type="number" value="0">
          </div>

        </div>

        <button
          class="primary"
          onclick="addTeam()"
        >
          Komanda əlavə et
        </button>

      </div>

      <!-- MATCH ADMIN -->

      <div class="card">

        <h2>Matç əlavə et</h2>

        <select id="homeTeam"></select>

        <select id="awayTeam"></select>

        <input
          id="matchDate"
          type="text"
          placeholder="Tarix"
        >

        <button
          class="primary"
          onclick="addMatch()"
        >
          Matç əlavə et
        </button>

      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Çıxış
      </button>

    </div>

  </section>

</div>

<script>

let teams = [];
let matches = [];

/* =========================
   TABS
========================= */

document.querySelectorAll(".tab").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".tab")
      .forEach(b => b.classList.remove("active"));

    document.querySelectorAll(".section")
      .forEach(s => s.classList.remove("active"));

    button.classList.add("active");

    document
      .getElementById(button.dataset.tab)
      .classList.add("active");

    if (button.dataset.tab === "admin") {
      checkAdmin();
    }

  });

});

/* =========================
   LOAD DATA
========================= */

async function loadTeams() {

  const response = await fetch("/api/teams");

  teams = await response.json();

  renderTeams();
  renderStandings();
  renderAdminTeams();
  fillTeamSelects();
}

async function loadMatches() {

  const response = await fetch("/api/matches");

  matches = await response.json();

  renderMatches();
}

/* =========================
   TEAMS
========================= */

function renderTeams() {

  const box =
    document.getElementById("teamsList");

  if (!teams.length) {

    box.innerHTML =
      "<p>Komanda yoxdur.</p>";

    return;
  }

  box.innerHTML = teams
    .map((team, index) => `
      <div class="match-row">
        <strong>
          ${index + 1}. ${escapeHtml(team.name)}
        </strong>
      </div>
    `)
    .join("");
}

/* =========================
   STANDINGS
========================= */

function renderStandings() {

  const tbody =
    document.getElementById("standings");

  tbody.innerHTML = teams
    .map((team, index) => `

      <tr>

        <td>${index + 1}</td>

        <td>
          <strong>
            ${escapeHtml(team.name)}
          </strong>
        </td>

        <td>${team.played}</td>
        <td>${team.wins}</td>
        <td>${team.draws}</td>
        <td>${team.losses}</td>
        <td>${team.goal_difference}</td>
        <td><strong>${team.points}</strong></td>

      </tr>

    `)
    .join("");
}

/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin() {

  try {

    const response =
      await fetch("/api/admin/me");

    if (response.ok) {

      document
        .getElementById("loginBox")
        .classList.add("hidden");

      document
        .getElementById("adminPanel")
        .classList.remove("hidden");

      renderAdminTeams();
      fillTeamSelects();

    } else {

      document
        .getElementById("loginBox")
        .classList.remove("hidden");

      document
        .getElementById("adminPanel")
        .classList.add("hidden");

    }

  } catch {

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

  }
}

/* =========================
   LOGIN
========================= */

async function login() {

  const password =
    document.getElementById("password").value;

  const response = await fetch(
    "/api/admin/login",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        password
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {

    document.getElementById(
      "loginError"
    ).textContent =
      data.error || "Xəta";

    return;
  }

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminPanel")
    .classList.remove("hidden");

  renderAdminTeams();
  fillTeamSelects();

}

/* =========================
   LOGOUT
========================= */

async function logout() {

  await fetch(
    "/api/admin/logout",
    {
      method: "POST"
    }
  );

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("adminPanel")
    .classList.add("hidden");

}

/* =========================
   ADMIN TEAMS
========================= */

function renderAdminTeams() {

  const box =
    document.getElementById("adminTeams");

  if (!teams.length) {

    box.innerHTML =
      "<p>Komanda yoxdur.</p>";

    return;
  }

  box.innerHTML = teams
    .map(team => `

      <div class="card">

        <input
          id="name-${team.id}"
          value="${escapeAttr(team.name)}"
          placeholder="Komanda adı"
        >

        <div class="stats-grid">

          <div>
            <label>O</label>
            <input
              id="played-${team.id}"
              type="number"
              value="${team.played}"
            >
          </div>

          <div>
            <label>Q</label>
            <input
              id="wins-${team.id}"
              type="number"
              value="${team.wins}"
            >
          </div>

          <div>
            <label>B</label>
            <input
              id="draws-${team.id}"
              type="number"
              value="${team.draws}"
            >
          </div>

          <div>
            <label>M</label>
            <input
              id="losses-${team.id}"
              type="number"
              value="${team.losses}"
            >
          </div>

          <div>
            <label>AV</label>
            <input
              id="gd-${team.id}"
              type="number"
              value="${team.goal_difference}"
            >
          </div>

          <div>
            <label>X</label>
            <input
              id="points-${team.id}"
              type="number"
              value="${team.points}"
            >
          </div>

        </div>

        <div class="match-buttons">

          <button
            class="save"
            onclick="saveTeam(${team.id})"
          >
            Yadda saxla
          </button>

          <button
            class="danger"
            onclick="deleteTeam(${team.id})"
          >
            Sil
          </button>

        </div>

      </div>

    `)
    .join("");
}

/* =========================
   SAVE TEAM
========================= */

async function saveTeam(id) {

  const data = {

    name:
      document.getElementById(
        `name-${id}`
      ).value,

    played:
      Number(
        document.getElementById(
          `played-${id}`
        ).value
      ),

    wins:
      Number(
        document.getElementById(
          `wins-${id}`
        ).value
      ),

    draws:
      Number(
        document.getElementById(
          `draws-${id}`
        ).value
      ),

    losses:
      Number(
        document.getElementById(
          `losses-${id}`
        ).value
      ),

    goalDifference:
      Number(
        document.getElementById(
          `gd-${id}`
        ).value
      ),

    points:
      Number(
        document.getElementById(
          `points-${id}`
        ).value
      )

  };

  const response = await fetch(
    `/api/teams/${id}`,
    {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    }
  );

  if (!response.ok) {

    const error =
      await response.json();

    alert(error.error || "Xəta");

    return;
  }

  await loadTeams();

  alert("Yadda saxlanıldı!");

}

/* =========================
   ADD TEAM
========================= */

async function addTeam() {

  const data = {

    name:
      document.getElementById(
        "newTeamName"
      ).value,

    played:
      Number(
        document.getElementById(
          "newPlayed"
        ).value
      ),

    wins:
      Number(
        document.getElementById(
          "newWins"
        ).value
      ),

    draws:
      Number(
        document.getElementById(
          "newDraws"
        ).value
      ),

    losses:
      Number(
        document.getElementById(
          "newLosses"
        ).value
      ),

    goalDifference:
      Number(
        document.getElementById(
          "newGoalDifference"
        ).value
      ),

    points:
      Number(
        document.getElementById(
          "newPoints"
        ).value
      )

  };

  if (!data.name.trim()) {

    alert("Komanda adını yaz");

    return;
  }

  const response = await fetch(
    "/api/teams",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    }
  );

  if (!response.ok) {

    const error =
      await response.json();

    alert(error.error || "Xəta");

    return;
  }

  document.getElementById(
    "newTeamName"
  ).value = "";

  await loadTeams();

  alert("Komanda əlavə edildi!");

}

/* =========================
   DELETE TEAM
========================= */

async function deleteTeam(id) {

  if (!confirm("Komandanı silmək istəyirsən?")) {
    return;
  }

  await fetch(
    `/api/teams/${id}`,
    {
      method: "DELETE"
    }
  );

  await loadTeams();

}

/* =========================
   SELECTS
========================= */

function fillTeamSelects() {

  const home =
    document.getElementById("homeTeam");

  const away =
    document.getElementById("awayTeam");

  if (!home || !away) return;

  const options = teams
    .map(team => `
      <option value="${team.id}">
        ${escapeHtml(team.name)}
      </option>
    `)
    .join("");

  home.innerHTML = options;
  away.innerHTML = options;

}

/* =========================
   ADD MATCH
========================= */

async function addMatch() {

  const homeTeamId =
    Number(
      document.getElementById(
        "homeTeam"
      ).value
    );

  const awayTeamId =
    Number(
      document.getElementById(
        "awayTeam"
      ).value
    );

  const matchDate =
    document.getElementById(
      "matchDate"
    ).value;

  if (homeTeamId === awayTeamId) {

    alert(
      "İki fərqli komanda seçin"
    );

    return;
  }

  const response = await fetch(
    "/api/matches",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        homeTeamId,
        awayTeamId,
        matchDate
      })
    }
  );

  if (!response.ok) {

    const error =
      await response.json();

    alert(error.error || "Xəta");

    return;
  }

  await loadMatches();

  alert("Matç əlavə edildi!");

}

/* =========================
   MATCHES
========================= */

function renderMatches() {

  const box =
    document.getElementById(
      "matchesList"
    );

  if (!matches.length) {

    box.innerHTML =
      "<p>Matç yoxdur.</p>";

    return;
  }

  box.innerHTML = matches
    .map(match => {

      const score =
        match.home_score !== null &&
        match.away_score !== null
          ? `${match.home_score} : ${match.away_score}`
          : "- : -";

      return `

        <div class="match-row">

          <strong>
            ${escapeHtml(match.home_team)}
            &nbsp; ${score} &nbsp;
            ${escapeHtml(match.away_team)}
          </strong>

          <div>
            ${escapeHtml(
              match.match_date || ""
            )}
          </div>

        </div>

      `;

    })
    .join("");
}

/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function escapeAttr(value) {
  return escapeHtml(value);
}

/* =========================
   START
========================= */

loadTeams();
loadMatches();

</script>

</body>
</html>
