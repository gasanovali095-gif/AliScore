<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AliScore</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f3f6;
color:#111;
}

header{
background:#111;
color:white;
text-align:center;
padding:28px 20px;
}

header h1{
margin:0;
font-size:42px;
}

.container{
max-width:950px;
margin:30px auto;
padding:0 16px;
}

.nav{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

button{
border:0;
border-radius:16px;
padding:16px;
background:#111;
color:white;
font-size:18px;
cursor:pointer;
}

button.danger{
background:#b00020;
}

button.light{
background:#eee;
color:#111;
}

.card{
background:white;
border-radius:22px;
padding:22px;
margin-bottom:20px;
}

.hidden{
display:none;
}

.team{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:14px 0;
border-bottom:1px solid #ddd;
font-size:20px;
}

.team:last-child{
border-bottom:0;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#111;
color:white;
padding:10px 5px;
}

td{
padding:10px 5px;
border-bottom:1px solid #ddd;
text-align:center;
}

td:nth-child(2){
text-align:left;
font-weight:bold;
}

.match{
padding:16px 0;
border-bottom:1px solid #ddd;
}

.matchline{
font-size:20px;
font-weight:bold;
text-align:center;
}

.meta{
text-align:center;
color:#777;
margin-bottom:8px;
}

.form{
display:grid;
gap:10px;
margin-top:15px;
}

input,select{
width:100%;
padding:14px;
border:1px solid #aaa;
border-radius:12px;
font-size:17px;
background:white;
}

.status{
padding:10px;
border-radius:10px;
background:#eee;
margin-bottom:12px;
}

.admin-match{
display:grid;
grid-template-columns:1fr 70px 70px 1fr auto;
gap:8px;
align-items:center;
margin:10px 0;
}

@media(max-width:650px){

header h1{
font-size:34px;
}

.nav{
grid-template-columns:1fr;
}

.admin-match{
grid-template-columns:1fr 55px 55px 1fr;
}

.admin-match button{
grid-column:1/-1;
}

table{
font-size:13px;
}

}
</style>
</head>

<body>

<header>
<h1>AliScore</h1>
</header>

<main class="container">

<nav class="nav">
<button onclick="show('teams')">Komandalar</button>
<button onclick="show('standings')">Turnir cədvəli</button>
<button onclick="show('matches')">Matçlar</button>
</nav>


<section id="teams" class="card">

<h2>👥 Komandalar</h2>

<div id="teamsList">
Yüklənir...
</div>

</section>


<section id="standings" class="card hidden">

<h2>🏆 Turnir cədvəli</h2>

<table>

<thead>

<tr>
<th>#</th>
<th>Komanda</th>
<th>O</th>
<th>Q</th>
<th>B</th>
<th>M</th>
<th>AV</th>
<th>X</th>
</tr>

</thead>

<tbody id="standingsBody">

</tbody>

</table>

</section>


<section id="matches" class="card hidden">

<h2>⚽ Matçlar</h2>

<div id="matchesList">
Yüklənir...
</div>

</section>


<section id="admin" class="card hidden">

<h2>⚙️ Admin paneli</h2>

<div id="loginBox">

<input
id="adminPassword"
type="password"
placeholder="Admin şifrəsi"
>

<button
style="margin-top:10px"
onclick="login()"
>
Daxil ol
</button>

</div>


<div id="panel" class="hidden">

<div class="status">
Admin paneli aktivdir.
</div>


<h3>Komanda əlavə et</h3>

<div class="form">

<input
id="newTeam"
placeholder="Komanda adı"
>

<button onclick="addTeam()">
Komanda əlavə et
</button>

</div>


<h3>Komandaları idarə et</h3>

<div id="adminTeams"></div>


<h3>Yeni matç</h3>

<div class="form">

<select id="homeTeam"></select>

<select id="awayTeam"></select>

<input
id="matchDate"
placeholder="Tarix / saat, məsələn: 20.09.2026 18:00"
>

<button onclick="addMatch()">
Matç əlavə et
</button>

</div>


<h3>Matç nəticələri</h3>

<div id="adminMatches"></div>


<button
class="danger"
style="margin-top:20px"
onclick="logout()"
>
Çıxış
</button>

</div>

</section>


<button
class="light"
style="width:100%;margin-bottom:30px"
onclick="show('admin')"
>
⚙️ Admin paneli
</button>

</main>


<script>

let teams=[];


/* API */

async function api(url,options={}){

const r=await fetch(url,{
headers:{
"Content-Type":"application/json"
},
...options
});

const data=await r.json().catch(()=>({}));

if(!r.ok){
throw new Error(
data.error||"Xəta baş verdi"
);
}

return data;
}


/* Bölmə dəyiş */

function show(id){

[
"teams",
"standings",
"matches",
"admin"
].forEach(x=>{

document
.getElementById(x)
.classList
.add("hidden");

});

document
.getElementById(id)
.classList
.remove("hidden");


if(id==="teams"){
loadTeams();
}

if(id==="standings"){
loadTeams();
}

if(id==="matches"){
loadMatches();
}

if(id==="admin"){
checkAdmin();
}

}


/* Komandaları yüklə */

async function loadTeams(){

try{

teams=await api("/api/teams");


/*
Əgər serverdə komandalar varsa,
onları göstəririk.
*/

document.getElementById("teamsList").innerHTML=

teams.length

?teams.map(t=>`

<div class="team">

<span>
${esc(t.name)}
</span>

</div>

`).join("")

:"<p>Hələ komanda yoxdur.</p>";


/* Turnir cədvəli */

document.getElementById("standingsBody").innerHTML=

teams.map((t,i)=>`

<tr>

<td>
${i+1}
</td>

<td>
${esc(t.name)}
</td>

<td>
${t.played||0}
</td>

<td>
${t.wins||0}
</td>

<td>
${t.draws||0}
</td>

<td>
${t.losses||0}
</td>

<td>
${t.goal_difference||0}
</td>

<td>
<b>
${t.points||0}
</b>
</td>

</tr>

`).join("");


fillTeamSelects();


if(
!document
.getElementById("panel")
.classList
.contains("hidden")
){

renderAdminTeams();

}

}catch(e){

console.error(e);

}

}


/* Komanda seçimləri */

function fillTeamSelects(){

const opts=teams.map(t=>`

<option value="${t.id}">
${esc(t.name)}
</option>

`).join("");


document
.getElementById("homeTeam")
.innerHTML=opts;

document
.getElementById("awayTeam")
.innerHTML=opts;

}


/* Admin yoxla */

async function checkAdmin(){

try{

await api("/api/admin/me");

document
.getElementById("loginBox")
.classList
.add("hidden");

document
.getElementById("panel")
.classList
.remove("hidden");

await loadTeams();

await loadMatches();

}catch{

document
.getElementById("loginBox")
.classList
.remove("hidden");

document
.getElementById("panel")
.classList
.add("hidden");

}

}


/* Admin giriş */

async function login(){

try{

await api(
"/api/admin/login",
{
method:"POST",

body:JSON.stringify({
password:
document
.getElementById("adminPassword")
.value
})
}
);

document
.getElementById("adminPassword")
.value="";

checkAdmin();

}catch(e){

alert(e.message);

}

}


/* Çıxış */

async function logout(){

await api(
"/api/admin/logout",
{
method:"POST"
}
);

checkAdmin();

}


/* Admin komandaları */

function renderAdminTeams(){

document.getElementById("adminTeams").innerHTML=

teams.map(t=>`

<div class="team">

<input
id="team-${t.id}"
value="${escAttr(t.name)}"
>

<div class="actions">

<button
onclick="renameTeam(${t.id})"
>
Yadda saxla
</button>

<button
class="danger"
onclick="deleteTeam(${t.id})"
>
Sil
</button>

</div>

</div>

`).join("");

}


/* Komanda əlavə et */

async function addTeam(){

const name=
document
.getElementById("newTeam")
.value
.trim();

if(!name){

return alert(
"Komanda adını yazın."
);

}

try{

await api(
"/api/teams",
{
method:"POST",

body:JSON.stringify({
name
})
}
);

document
.getElementById("newTeam")
.value="";

await loadTeams();

}catch(e){

alert(e.message);

}

}


/* Komanda dəyiş */

async function renameTeam(id){

const name=
document
.getElementById("team-"+id)
.value
.trim();

if(!name){

return alert(
"Komanda adı boş ola bilməz."
);

}

try{

await api(
"/api/teams/"+id,
{
method:"PUT",

body:JSON.stringify({
name
})
}
);

await loadTeams();

await loadMatches();

}catch(e){

alert(e.message);

}

}


/* Komanda sil */

async function deleteTeam(id){

if(
!confirm(
"Bu komanda və onun matçları silinsin?"
)
){

return;

}

try{

await api(
"/api/teams/"+id,
{
method:"DELETE"
}
);

await loadTeams();

await loadMatches();

}catch(e){

alert(e.message);

}

}


/* Matç əlavə et */

async function addMatch(){

const homeTeamId=
Number(
document
.getElementById("homeTeam")
.value
);

const awayTeamId=
Number(
document
.getElementById("awayTeam")
.value
);

const matchDate=
document
.getElementById("matchDate")
.value
.trim();


if(homeTeamId===awayTeamId){

return alert(
"İki fərqli komanda seçin."
);

}


try{

await api(
"/api/matches",
{
method:"POST",

body:JSON.stringify({

homeTeamId,
awayTeamId,
matchDate

})
}
);

document
.getElementById("matchDate")
.value="";

await loadMatches();

}catch(e){

alert(e.message);

}

}


/* Matçları yüklə */

async function loadMatches(){

try{

const ms=
await api("/api/matches");


document.getElementById("matchesList").innerHTML=

ms.length

?ms.map(m=>`

<div class="match">

<div class="meta">

${esc(
m.match_date||
"Tarix yoxdur"
)}

</div>

<div class="matchline">

${esc(m.home_team)}

${
m.home_score===null

?" - "

:m.home_score+
" : "+
m.away_score
}

${esc(m.away_team)}

</div>

</div>

`).join("")

:"<p>Hələ matç yoxdur.</p>";


renderAdminMatches(ms);

}catch(e){

console.error(e);

}

}


/* Admin matçları */

function renderAdminMatches(ms){

document.getElementById("adminMatches").innerHTML=

ms.length

?ms.map(m=>`

<div class="admin-match">

<div>
${esc(m.home_team)}
</div>

<input
id="hs-${m.id}"
type="number"
min="0"
value="${m.home_score??""}"
placeholder="-"
>

<input
id="as-${m.id}"
type="number"
min="0"
value="${m.away_score??""}"
placeholder="-"
>

<div>
${esc(m.away_team)}
</div>

<button
onclick="saveMatch(${m.id})"
>
Yadda saxla
</button>

<input
style="grid-column:1/-1"
id="date-${m.id}"
value="${escAttr(m.match_date||"")}"
placeholder="Tarix / saat"
>

<button
class="danger"
style="grid-column:1/-1"
onclick="deleteMatch(${m.id})"
>
Matçı sil
</button>

</div>

`).join("")

:"<p>Hələ matç yoxdur.</p>";

}


/* Nəticəni yadda saxla */

async function saveMatch(id){

try{

await api(
"/api/matches/"+id,
{
method:"PUT",

body:JSON.stringify({

homeScore:
document
.getElementById("hs-"+id)
.value,

awayScore:
document
.getElementById("as-"+id)
.value,

matchDate:
document
.getElementById("date-"+id)
.value

})
}
);

await loadTeams();

await loadMatches();

alert(
"Nəticə yadda saxlanıldı."
);

}catch(e){

alert(e.message);

}

}


/* Matçı sil */

async function deleteMatch(id){

if(
!confirm("Matç silinsin?")
){

return;

}

try{

await api(
"/api/matches/"+id,
{
method:"DELETE"
}
);

await loadTeams();

await loadMatches();

}catch(e){

alert(e.message);

}

}


/* Təhlükəsizlik */

function esc(s){

return String(s).replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
);

}

function escAttr(s){

return esc(s);

}


/* Başlanğıc */

loadTeams();

loadMatches();

</script>

</body>
</html>
