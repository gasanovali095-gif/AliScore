<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AliScore</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#111;color:#fff;text-align:center;padding:18px}
header h1{margin:0}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#fff;padding:12px;border-bottom:1px solid #ddd}
button{border:0;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer}
.nav{background:#eee}.nav.active{background:#111;color:#fff}
main{max-width:1000px;margin:20px auto;padding:0 12px}
.section{display:none}.section.active{display:block}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:18px;box-shadow:0 2px 8px #0000000f}
h2{margin-top:0}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:11px 8px;border-bottom:1px solid #ddd;text-align:center}
th{background:#eee}
th:nth-child(2),td:nth-child(2){text-align:left}
input,select{width:100%;padding:10px;margin:5px 0 10px;border:1px solid #ccc;border-radius:7px;font-size:15px}
.login{max-width:400px;margin:auto}
#adminPanel{display:none}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.team,.match{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.save{background:#198754;color:white}.edit{background:#0d6efd;color:white}.delete{background:#dc3545;color:white}.add{background:#111;color:white}.logout{background:#555;color:white}
.matchbox{display:grid;grid-template-columns:1fr 70px 70px 1fr;gap:8px;align-items:center}
.small{color:#777;font-size:13px;margin-bottom:5px}
@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<body>

<header>
<h1>⚽ AliScore</h1>
</header>

<nav>
<button class="nav active" onclick="show('teams',this)">Komandalar</button>
<button class="nav" onclick="show('table',this)">Turnir cədvəli</button>
<button class="nav" onclick="show('matches',this)">Matçlar</button>
<button class="nav" onclick="show('admin',this)">Admin</button>
</nav>

<main>

<section id="teams" class="section active">
<div class="card">
<h2>Komandalar</h2>
<div id="teamsList"></div>
</div>
</section>

<section id="table" class="section">
<div class="card">
<h2>Turnir cədvəli</h2>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>#</th><th>Komanda</th><th>O</th><th>Q</th><th>B</th><th>M</th><th>AV</th><th>X</th>
</tr>
</thead>
<tbody id="standings"></tbody>
</table>
</div>
</div>
</section>

<section id="matches" class="section">
<div class="card">
<h2>Matçlar</h2>
<div id="matchesList"></div>
</div>
</section>

<section id="admin" class="section">

<div id="loginBox" class="card login">
<h2>Admin giriş</h2>
<input id="password" type="password" placeholder="Şifrə">
<button class="add" onclick="login()">Daxil ol</button>
<p id="loginMsg"></p>
</div>

<div id="adminPanel">

<div class="card">
<h2>Komandaları idarə et</h2>
<div id="adminTeams"></div>

<hr>

<h3>Yeni komanda</h3>
<input id="newName" placeholder="Komanda adı">

<div class="grid">
<input id="newO" type="number" placeholder="O">
<input id="newQ" type="number" placeholder="Q">
<input id="newB" type="number" placeholder="B">
<input id="newM" type="number" placeholder="M">
<input id="newAV" type="number" placeholder="AV">
<input id="newX" type="number" placeholder="X">
</div>

<button class="add" onclick="addTeam()">+ Komanda əlavə et</button>
</div>

<div class="card">
<h2>Yeni matç</h2>

<label>Tarix</label>
<input id="newDate" type="date">

<label>Ev sahibi</label>
<select id="home"></select>

<label>Qonaq</label>
<select id="away"></select>

<div class="matchbox">
<input id="homeScore" type="number" min="0" placeholder="0">
<div style="text-align:center">:</div>
<input id="awayScore" type="number" min="0" placeholder="0">
<div></div>
</div>

<button class="add" onclick="addMatch()">+ Matç əlavə et</button>
</div>

<div class="card">
<h2>Matçları idarə et</h2>
<div id="adminMatches"></div>
</div>

<div class="card">
<button class="logout" onclick="logout()">Çıxış</button>
</div>

</div>
</section>

</main>

<script>

let teams=[];
let matches=[];
let admin=false;

function show(id,btn){
document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
document.getElementById(id).classList.add('active');
document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
}

function safe(x){
return String(x??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;')
.replaceAll("'","&#039;");
}

async function loadTeams(){
const r=await fetch('/api/teams');
teams=await r.json();
renderTeams();
renderTable();
renderSelects();
if(admin)renderAdminTeams();
}

function renderTeams(){
const box=document.getElementById('teamsList');
box.innerHTML='';
teams.forEach((t,i)=>{
box.innerHTML+=`
<div class="team">
<strong>${i+1}. ${safe(t.name)}</strong>
</div>`;
});
}

function renderTable(){
const body=document.getElementById('standings');
body.innerHTML='';

let arr=[...teams].sort((a,b)=>{
if(Number(b.points)!==Number(a.points))
return Number(b.points)-Number(a.points);
if(Number(b.goal_difference)!==Number(a.goal_difference))
return Number(b.goal_difference)-Number(a.goal_difference);
return Number(b.wins)-Number(a.wins);
});

arr.forEach((t,i)=>{
body.innerHTML+=`
<tr>
<td>${i+1}</td>
<td><strong>${safe(t.name)}</strong></td>
<td>${t.played}</td>
<td>${t.wins}</td>
<td>${t.draws}</td>
<td>${t.losses}</td>
<td>${Number(t.goal_difference)>0?'+':''}${t.goal_difference}</td>
<td><strong>${t.points}</strong></td>
</tr>`;
});
}

function renderSelects(){
const h=document.getElementById('home');
const a=document.getElementById('away');
h.innerHTML='';
a.innerHTML='';

teams.forEach(t=>{
h.innerHTML+=`<option value="${t.id}">${safe(t.name)}</option>`;
a.innerHTML+=`<option value="${t.id}">${safe(t.name)}</option>`;
});
}

function renderAdminTeams(){
const box=document.getElementById('adminTeams');
box.innerHTML='';

teams.forEach(t=>{
box.innerHTML+=`
<div class="team">

<input id="n${t.id}" value="${safe(t.name)}">

<div class="grid">
<input id="o${t.id}" type="number" value="${t.played}" placeholder="O">
<input id="q${t.id}" type="number" value="${t.wins}" placeholder="Q">
<input id="b${t.id}" type="number" value="${t.draws}" placeholder="B">
<input id="m${t.id}" type="number" value="${t.losses}" placeholder="M">
<input id="av${t.id}" type="number" value="${t.goal_difference}" placeholder="AV">
<input id="x${t.id}" type="number" value="${t.points}" placeholder="X">
</div>

<div class="actions">
<button class="save" onclick="saveTeam(${t.id})">Yadda saxla</button>
<button class="delete" onclick="deleteTeam(${t.id})">Sil</button>
</div>

</div>`;
});
}

async function saveTeam(id){

const data={
name:document.getElementById('n'+id).value,
played:Number(document.getElementById('o'+id).value||0),
wins:Number(document.getElementById('q'+id).value||0),
draws:Number(document.getElementById('b'+id).value||0),
losses:Number(document.getElementById('m'+id).value||0),
goal_difference:Number(document.getElementById('av'+id).value||0),
points:Number(document.getElementById('x'+id).value||0)
};

const r=await fetch('/api/teams/'+id,{
method:'PUT',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
});

if(!r.ok){
alert('Saxlama xətası');
return;
}

await loadTeams();
}

async function addTeam(){

const name=document.getElementById('newName').value.trim();

if(!name){
alert('Komanda adını yaz');
return;
}

const data={
name:name,
played:Number(document.getElementById('newO').value||0),
wins:Number(document.getElementById('newQ').value||0),
draws:Number(document.getElementById('newB').value||0),
losses:Number(document.getElementById('newM').value||0),
goal_difference:Number(document.getElementById('newAV').value||0),
points:Number(document.getElementById('newX').value||0)
};

const r=await fetch('/api/teams',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
});

if(!r.ok){
alert('Komanda əlavə olunmadı');
return;
}

document.getElementById('newName').value='';
await loadTeams();
}

async function deleteTeam(id){

if(!confirm('Bu komandanı silmək istəyirsən?'))return;

const r=await fetch('/api/teams/'+id,{method:'DELETE'});

if(!r.ok){
alert('Silinmədi');
return;
}

await loadTeams();
}

async function loadMatches(){

const r=await fetch('/api/matches');
matches=await r.json();

renderMatches();
if(admin)renderAdminMatches();
}

function teamName(id){
const t=teams.find(x=>Number(x.id)===Number(id));
return t?t.name:'Komanda';
}

function renderMatches(){

const box=document.getElementById('matchesList');
box.innerHTML='';

if(!matches.length){
box.innerHTML='<p>Hələ matç yoxdur.</p>';
return;
}

matches.forEach(m=>{
box.innerHTML+=`
<div class="match">
<div class="small">${safe(m.match_date||'')}</div>
<strong>
${safe(teamName(m.home_team_id))}
&nbsp; ${m.home_score}:${m.away_score} &nbsp;
${safe(teamName(m.away_team_id))}
</strong>
</div>`;
});
}

function renderAdminMatches(){

const box=document.getElementById('adminMatches');
box.innerHTML='';

if(!matches.length){
box.innerHTML='<p>Hələ matç yoxdur.</p>';
return;
}

matches.forEach(m=>{
box.innerHTML+=`
<div class="match">

<div class="small">Tarix: ${safe(m.match_date||'')}</div>

<strong>
${safe(teamName(m.home_team_id))}
&nbsp; ${m.home_score}:${m.away_score} &nbsp;
${safe(teamName(m.away_team_id))}
</strong>

<div class="actions">
<button class="edit" onclick="editMatch(${m.id})">
✏️ Dəyiş
</button>

<button class="delete" onclick="deleteMatch(${m.id})">
🗑️ Sil
</button>
</div>

</div>`;
});
}

async function addMatch(){

const h=Number(document.getElementById('home').value);
const a=Number(document.getElementById('away').value);

if(h===a){
alert('Eyni komandanı seçmək olmaz');
return;
}

const data={
match_date:document.getElementById('newDate').value,
home_team_id:h,
away_team_id:a,
home_score:Number(document.getElementById('homeScore').value||0),
away_score:Number(document.getElementById('awayScore').value||0)
};

const r=await fetch('/api/matches',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
});

if(!r.ok){
alert('Matç əlavə olunmadı');
return;
}

document.getElementById('homeScore').value='';
document.getElementById('awayScore').value='';

await loadMatches();
}

async function editMatch(id){

const m=matches.find(x=>Number(x.id)===Number(id));

if(!m)return;

const date=prompt('Matç tarixi:',m.match_date||'');
if(date===null)return;

const hs=prompt('Ev sahibinin hesabı:',m.home_score);
if(hs===null)return;

const as=prompt('Qonağın hesabı:',m.away_score);
if(as===null)return;

const data={
match_date:date,
home_team_id:Number(m.home_team_id),
away_team_id:Number(m.away_team_id),
home_score:Number(hs),
away_score:Number(as)
};

const r=await fetch('/api/matches/'+id,{
method:'PUT',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
});

if(!r.ok){
alert('Matçı dəyişmək alınmadı');
return;
}

await loadMatches();
}

async function deleteMatch(id){

if(!confirm('Bu matçı silmək istəyirsən?'))return;

const r=await fetch('/api/matches/'+id,{
method:'DELETE'
});

if(!r.ok){
alert('Matçı silmək alınmadı');
return;
}

await loadMatches();
}

async function login(){

const password=document.getElementById('password').value;

const r=await fetch('/api/admin/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({password})
});

if(!r.ok){
document.getElementById('loginMsg').textContent='Şifrə yanlışdır';
return;
}

admin=true;

document.getElementById('loginBox').style.display='none';
document.getElementById('adminPanel').style.display='block';

renderAdminTeams();
renderAdminMatches();
}

async function logout(){

await fetch('/api/admin/logout',{method:'POST'});

admin=false;

document.getElementById('loginBox').style.display='block';
document.getElementById('adminPanel').style.display='none';
}

async function checkAdmin(){

try{

const r=await fetch('/api/admin/me');

if(r.ok){

admin=true;

document.getElementById('loginBox').style.display='none';
document.getElementById('adminPanel').style.display='block';

renderAdminTeams();
renderAdminMatches();

}

}catch(e){}
}

async function start(){

await loadTeams();
await loadMatches();
await checkAdmin();

}

start();

</script>

</body>
</html>
