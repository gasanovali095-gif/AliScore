<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AliScore</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}header{position:sticky;top:0;z-index:20;background:#0b1728;padding:14px;box-shadow:0 2px 12px #0006}header h1{margin:0 0 12px;color:#28a9ff}nav{display:flex;gap:6px;overflow:auto}nav button{border:0;background:#13253b;color:#fff;padding:10px 12px;border-radius:9px;white-space:nowrap}nav button.active{background:#1688dc}main{max-width:1150px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#0d1b2d;border:1px solid #193451;border-radius:14px;padding:15px;margin:10px 0}.stat{font-size:28px;font-weight:bold;color:#36b1ff}button,input,select{font:inherit}button.action{background:#1688dc;color:#fff;border:0;border-radius:9px;padding:10px 13px;margin:4px;cursor:pointer}button.danger{background:#b52d3a}button.good{background:#198754}button.small{padding:6px 9px;font-size:13px}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #28445f;background:#081524;color:#fff;margin:5px 0}table{width:100%;border-collapse:collapse;background:#0d1b2d}th,td{padding:9px;border-bottom:1px solid #20364d;text-align:center}th{color:#7ecbff}.team{font-weight:bold}.muted{color:#9eb1c5}.score{font-size:22px;font-weight:bold}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.hidden{display:none}.photo{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#17304b;vertical-align:middle}.login{max-width:400px;margin:30px auto}.playerRow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #20364d;padding:10px 0}.playerMain{display:flex;align-items:center;gap:9px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#13253b;margin:2px;font-size:12px}.notice{padding:12px;border-radius:10px;background:#10253a;border:1px solid #1f527b;margin:10px 0}.error{background:#3b1117;border-color:#8b2732}.success{background:#10351f;border-color:#267844}.adminBlock{border-top:1px solid #23415d;padding-top:10px;margin-top:12px}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><h1>⚽ AliScore</h1><nav id="nav">
<button data-page="home">Ana səhifə</button><button data-page="matches">Matçlar</button><button data-page="table">Turnir</button><button data-page="teams">Komandalar</button><button data-page="lineups">Heyətlər</button><button data-page="cards">Kartlar</button><button data-page="stats">Statistika</button><button data-page="week">⭐ Komanda həftəsi</button><button data-page="transfers">🔄 Transferlər</button><button data-page="admin">İdarəetmə</button>
</nav></header>
<main>
<section id="home" class="page active"><h2>Ana səhifə</h2><div class="grid"><div class="card">Komandalar<div id="teamCount" class="stat">0</div></div><div class="card">Matçlar<div id="matchCount" class="stat">0</div></div><div class="card">Qollar<div id="goalCount" class="stat">0</div></div><div class="card"><b>🔔 AliScore bildirişləri</b><div id="pushStatus" class="muted">Yoxlanılır...</div><button class="action" onclick="enablePush()">Bildirişləri aktiv et</button></div></div><div id="notice"></div><div class="card"><h3>Son matçlar</h3><div id="recent"></div></div></section>
<section id="matches" class="page"><h2>Matçlar</h2><div id="matchesList"></div></section>
<section id="table" class="page"><h2>Turnir cədvəli</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Komanda</th><th>O</th><th>Q</th><th>H</th><th>M</th><th>GF</th><th>GA</th><th>GD</th><th>X</th></tr></thead><tbody id="tableBody"></tbody></table></div></section>
<section id="teams" class="page"><h2>Komandalar</h2><div id="teamsList"></div></section>
<section id="lineups" class="page"><h2>Heyətlər</h2><select id="lineupTeam"></select><div id="lineupList"></div></section>
<section id="cards" class="page"><h2>Kartlar</h2><div id="cardsList"></div></section>
<section id="stats" class="page"><h2>📊 Statistika</h2><div id="statsList"></div></section>
<section id="week" class="page"><h2>⭐ Komanda həftəsi</h2><div id="weekList"></div></section>
<section id="transfers" class="page"><h2>🔄 Transferlər</h2><div id="transferList"></div></section>
<section id="admin" class="page"><div id="adminLogin" class="login card"><h2>👑 Admin giriş</h2><input id="adminPassword" type="password" placeholder="Şifrə"><button class="action" onclick="login()">Daxil ol</button></div><div id="adminPanel" class="hidden"></div></section>
</main>
<script>
const A="/api";let state={teams:[],players:[],matches:[],events:[]};let isAdmin=false;let currentPage="home";
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opt={}){const r=await fetch(A+url,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Xəta");return d}
function go(p){currentPage=p;document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(p).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
async function load(){try{state=await api("/state");isAdmin=(await api("/admin/me")).loggedIn;render();await pushStatus()}catch(e){$("notice").innerHTML='<div class="card error">Server xətası: '+esc(e.message)+'</div>'}}
function team(id){return state.teams.find(x=>x.id==id)?.name||"—"}function player(id){return state.players.find(x=>x.id==id)?.name||"—"}
function render(){home();matches();table();teams();lineups();cards();stats();week();transfers();admin()}
function home(){$("teamCount").textContent=state.teams.length;$("matchCount").textContent=state.matches.length;$("goalCount").textContent=state.players.reduce((a,p)=>a+(+p.goals||0),0);$("recent").innerHTML=state.matches.slice(0,8).map(m=>matchCard(m)).join("")||"Matç yoxdur"}
function matchCard(m){return `<div class="card"><b>${esc(team(m.home_team))}</b> <span class="score">${m.home_score} : ${m.away_score}</span> <b>${esc(team(m.away_team))}</b><div class="muted">${esc(m.status)} • ${m.date?new Date(m.date).toLocaleString("az-AZ"):""}</div></div>`}
function matches(){$("matchesList").innerHTML=state.matches.map(matchCard).join("")||"Matç yoxdur"}
function table(){let a=state.teams.map(t=>({t,o:0,q:0,h:0,m:0,gf:0,ga:0}));state.matches.filter(x=>x.status==="finished"||x.status==="BİTDİ").forEach(x=>{let h=a.find(z=>z.t.id==x.home_team),v=a.find(z=>z.t.id==x.away_team);if(!h||!v)return;h.o++;v.o++;h.gf+=+x.home_score;h.ga+=+x.away_score;v.gf+=+x.away_score;v.ga+=+x.home_score;if(+x.home_score>+x.away_score){h.q++;v.m++}else if(+x.home_score<+x.away_score){v.q++;h.m++}else{h.h++;v.h++}});a.sort((x,y)=>(y.q*3+y.h)-(x.q*3+x.h)||((y.gf-y.ga)-(x.gf-x.ga))||y.gf-x.gf);$("tableBody").innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td class="team">${esc(x.t.name)}</td><td>${x.o}</td><td>${x.q}</td><td>${x.h}</td><td>${x.m}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gf-x.ga}</td><td>${x.q*3+x.h}</td></tr>`).join("")}
function teams(){$("teamsList").innerHTML=state.teams.map(t=>{let ps=state.players.filter(p=>p.team_id==t.id);return `<div class="card"><h3>${esc(t.name)}</h3><div>${ps.length} oyunçu</div><div class="muted" style="margin-top:8px">${ps.map(p=>`<span class="pill">${esc(p.name)}</span>`).join("")||"Oyunçu yoxdur"}</div>${isAdmin?`<button class="action danger" onclick="delTeam(${t.id})">Sil</button>`:""}</div>`}).join("")}
function lineups(){let s=$("lineupTeam");if(!s.options.length||!state.teams.some(t=>t.id==s.value))s.innerHTML=state.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");let ps=state.players.filter(p=>p.team_id==s.value);$("lineupList").innerHTML=["Qapıçı","Müdafiə","Yarımmüdafiə","Hücum"].map(pos=>`<div class="card"><h3>${pos}</h3>${ps.filter(p=>p.position===pos).map(p=>`<div class="playerRow"><span>${esc(p.name)} ${p.number?`#${p.number}`:""}</span><span>⚽${p.goals||0} 🟨${p.yellow||0} 🟥${p.red||0}</span></div>`).join("")||"Yoxdur"}</div>`).join("")}
$("lineupTeam").onchange=()=>lineups();
function cards(){$("cardsList").innerHTML=state.players.filter(p=>(+p.yellow||0)+(+p.red||0)>0).sort((a,b)=>(b.yellow+b.red)-(a.yellow+a.red)).map(p=>`<div class="card"><b>${esc(p.name)}</b> — ${esc(team(p.team_id))}<div>🟨 ${p.yellow||0} &nbsp; 🟥 ${p.red||0}</div></div>`).join("")||"Kart yoxdur"}
function stats(){$("statsList").innerHTML=[...state.players].sort((a,b)=>(+b.goals||0)-(+a.goals||0)||(+b.assists||0)-(+a.assists||0)||(+b.rating||0)-(+a.rating||0)).map(p=>`<div class="card playerRow"><div class="playerMain">${p.photo?`<img class="photo" src="${esc(p.photo)}">`:`<div class="photo"></div>`}<div><b>${esc(p.name)}</b><div class="muted">${esc(team(p.team_id))}</div></div></div><div>⚽ ${p.goals||0} • 🎯 ${p.assists||0} • 🧤 ${p.saves||0} • ⭐ ${p.rating||0}</div></div>`).join("")||"Statistika yoxdur"}
async function week(){try{let x=await api("/team-of-week");$("weekList").innerHTML=x.map(w=>`<div class="card"><b>Həftə: ${esc(w.week)}</b><p>🧤 ${esc(w.goalkeeper_name||"—")}</p><p>🛡️ ${esc(w.defender_name||"—")}</p><p>⚙️ ${esc(w.midfielder_name||"—")}</p><p>⚽ ${esc(w.attacker_name||"—")}</p></div>`).join("")||"Komanda həftəsi yoxdur"}catch(e){$("weekList").innerHTML="Komanda həftəsi yüklənmədi"}}
async function transfers(){try{let x=await api("/transfers");$("transferList").innerHTML=x.map(t=>`<div class="card">🔄 <b>${esc(t.player_name)}</b>: ${esc(t.from_team_name||"—")} → ${esc(t.to_team_name)}</div>`).join("")||"Transfer yoxdur"}catch{$("transferList").innerHTML="Transferlər yüklənmədi"}}
async function login(){try{await api("/admin/login",{method:"POST",body:JSON.stringify({password:$("adminPassword").value})});isAdmin=true;render();alert("Admin girişi uğurludur")}catch(e){alert(e.message)}}
async function logout(){await api("/admin/logout",{method:"POST"});isAdmin=false;render()}
async function delTeam(id){if(!confirm("Komandanı silmək istəyirsən?"))return;try{await api("/teams/"+id,{method:"DELETE"});await load()}catch(e){alert(e.message)}}
function optsTeams(){return state.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}
function optsPlayers(){return state.players.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(team(p.team_id))}</option>`).join("")}
function admin(){let p=$("adminPanel");if(!isAdmin){p.classList.add("hidden");$("adminLogin").classList.remove("hidden");return}$("adminLogin").classList.add("hidden");p.classList.remove("hidden");p.innerHTML=`
<div class="grid">
<div class="card"><h3>Komanda əlavə et</h3><input id="newTeam" placeholder="Komanda adı"><button class="action" onclick="addTeam()">Əlavə et</button></div>
<div class="card"><h3>Oyunçu əlavə et</h3><input id="pn" placeholder="Ad"><select id="pt">${optsTeams()}</select><select id="pp"><option value="Qapıçı">Qapıçı</option><option value="Müdafiə">Müdafiə</option><option value="Yarımmüdafiə">Yarımmüdafiə</option><option value="Hücum">Hücum</option></select><input id="pnum" type="number" placeholder="Nömrə"><button class="action" onclick="addPlayer()">Əlavə et</button></div>
<div class="card"><h3>Matç əlavə et</h3><select id="mh">${optsTeams()}</select><select id="ma">${optsTeams()}</select><div class="row"><input id="hs" type="number" value="0"><input id="as" type="number" value="0"></div><input id="md" type="datetime-local"><select id="ms"><option value="scheduled">PLAN</option><option value="live">CANLI</option><option value="finished">BİTDİ</option></select><button class="action" onclick="addMatch()">Əlavə et</button></div>
<div class="card"><h3>Transfer</h3><select id="trp">${optsPlayers()}</select><select id="trt">${optsTeams()}</select><input id="fee" type="number" placeholder="Məbləğ"><button class="action" onclick="transfer()">Transfer et</button></div>
<div class="card"><h3>⭐ Komanda həftəsi</h3><select id="w0">${optsPlayers()}</select><select id="w1">${optsPlayers()}</select><select id="w2">${optsPlayers()}</select><select id="w3">${optsPlayers()}</select><button class="action" onclick="saveWeek()">Yadda saxla</button></div>
<div class="card"><h3>🔔 Bildirişlər</h3><div id="adminPushStatus" class="muted">Status yoxlanılır...</div><button class="action" onclick="enablePush()">Bildirişləri aktiv et</button></div>
</div>
<div class="adminBlock"><h3>Matçları idarə et</h3>${state.matches.map(m=>`<div class="card"><div class="row"><select id="eh${m.id}">${optsTeams()}</select><select id="ea${m.id}">${optsTeams()}</select><input id="es1${m.id}" type="number" value="${m.home_score}"><input id="es2${m.id}" type="number" value="${m.away_score}"><select id="est${m.id}"><option value="scheduled">PLAN</option><option value="live">CANLI</option><option value="finished">BİTDİ</option></select></div><div class="muted">${esc(team(m.home_team))} — ${esc(team(m.away_team))}</div><button class="action" onclick="editMatch(${m.id})">Yadda saxla</button><button class="action danger" onclick="delMatch(${m.id})">Sil</button></div>`).join("")||"Matç yoxdur"}</div>
<div class="adminBlock"><h3>Oyunçu idarəetməsi — statistika, kartlar, foto</h3>${state.players.map(p=>`<div class="card"><div class="playerRow"><div class="playerMain">${p.photo?`<img class="photo" src="${esc(p.photo)}">`:`<div class="photo"></div>`}<div><b>${esc(p.name)}</b><div class="muted">${esc(team(p.team_id))}</div></div></div><div>⚽ ${p.goals||0} 🎯 ${p.assists||0} 🧤 ${p.saves||0} ⭐ ${p.rating||0}</div></div><div class="row"><button class="action small" onclick="changeStat(${p.id},'goal',1)">⚽ +</button><button class="action small" onclick="changeStat(${p.id},'goal',-1)">⚽ −</button><button class="action small" onclick="changeStat(${p.id},'yellow-card',1)">🟨 +</button><button class="action small" onclick="changeStat(${p.id},'yellow-card',-1)">🟨 −</button><button class="action small" onclick="changeStat(${p.id},'red-card',1)">🟥 +</button><button class="action small" onclick="changeStat(${p.id},'red-card',-1)">🟥 −</button></div><div class="row"><input id="g${p.id}" type="number" value="${p.goals||0}" placeholder="Qol"><input id="a${p.id}" type="number" value="${p.assists||0}" placeholder="Assist"><input id="s${p.id}" type="number" value="${p.saves||0}" placeholder="Saves"><input id="r${p.id}" type="number" value="${p.rating||0}" placeholder="Rating"></div><button class="action" onclick="saveStats(${p.id})">Statistikanı saxla</button><input id="ph${p.id}" placeholder="Foto URL (və ya data:image...)" value="${esc(p.photo||"")}"><button class="action" onclick="savePhoto(${p.id})">Foto saxla</button><button class="action danger" onclick="delPlayer(${p.id})">Oyunçunu sil</button></div>`).join("")}</div>
<div class="adminBlock"><h3>Hadisə / bildiriş</h3><select id="evmatch">${state.matches.map(m=>`<option value="${m.id}">${esc(team(m.home_team))} ${m.home_score}:${m.away_score} ${esc(team(m.away_team))}</option>`).join("")}</select><select id="evteam">${optsTeams()}</select><select id="evplayer">${optsPlayers()}</select><select id="evtype"><option value="goal">⚽ Qol</option><option value="yellow">🟨 Sarı kart</option><option value="red">🟥 Qırmızı kart</option></select><button class="action" onclick="addEvent()">Hadisəni əlavə et və bildiriş göndər</button></div>
<button class="action danger" onclick="logout()">Çıxış</button>`;
}
async function addTeam(){try{await api("/teams",{method:"POST",body:JSON.stringify({name:$("newTeam").value})});await load()}catch(e){alert(e.message)}}
async function addPlayer(){try{await api("/players",{method:"POST",body:JSON.stringify({name:$("pn").value,team_id:$("pt").value,position:$("pp").value,number:$("pnum").value})});await load()}catch(e){alert(e.message)}}
async function addMatch(){try{if($("mh").value===$("ma").value)throw Error("Eyni komanda ilə matç olmaz");let d=$("md").value?new Date($("md").value).toISOString():new Date().toISOString();await api("/matches",{method:"POST",body:JSON.stringify({home_team_id:$("mh").value,away_team_id:$("ma").value,home_score:$("hs").value,away_score:$("as").value,status:$("ms").value,match_date:d})});await load()}catch(e){alert(e.message)}}
async function editMatch(id){try{await api("/matches/"+id,{method:"PUT",body:JSON.stringify({home_team_id:$("eh"+id).value,away_team_id:$("ea"+id).value,home_score:$("es1"+id).value,away_score:$("es2"+id).value,status:$("est"+id).value,match_date:new Date().toISOString()})});await load()}catch(e){alert(e.message)}}
async function delMatch(id){if(!confirm("Matçı silmək istəyirsən?"))return;try{await api("/matches/"+id,{method:"DELETE"});await load()}catch(e){alert(e.message)}}
async function delPlayer(id){if(!confirm("Oyunçunu silmək istəyirsən?"))return;try{await api("/players/"+id,{method:"DELETE"});await load()}catch(e){alert(e.message)}}
async function transfer(){try{await api("/transfers",{method:"POST",body:JSON.stringify({player_id:$("trp").value,to_team_id:$("trt").value,fee:$("fee").value})});await load();alert("Transfer edildi və bildiriş göndərildi") }catch(e){alert(e.message)}}
async function saveWeek(){try{await api("/team-of-week",{method:"POST",body:JSON.stringify({goalkeeper_id:$("w0").value,defender_id:$("w1").value,midfielder_id:$("w2").value,attacker_id:$("w3").value})});await load();alert("Komanda həftəsi yadda saxlanıldı") }catch(e){alert(e.message)}}
async function changeStat(id,type,dir){try{let method=dir>0?"POST":"DELETE";await api(`/players/${id}/${type}`,{method});await load()}catch(e){alert(e.message)}}
async function saveStats(id){try{await api(`/players/${id}/stats`,{method:"PUT",body:JSON.stringify({goals:$("g"+id).value,assists:$("a"+id).value,saves:$("s"+id).value,rating:$("r"+id).value})});await load()}catch(e){alert(e.message)}}
async function savePhoto(id){try{await api(`/players/${id}/photo`,{method:"PUT",body:JSON.stringify({photo:$("ph"+id).value})});await load()}catch(e){alert(e.message)}}
async function addEvent(){try{await api("/events",{method:"POST",body:JSON.stringify({match_id:$("evmatch").value,team_id:$("evteam").value,player_id:$("evplayer").value,type:$("evtype").value})});await load();alert("Hadisə əlavə edildi və bildiriş göndərildi") }catch(e){alert(e.message)}}
async function pushStatus(){try{if(!('Notification'in window)){ $("pushStatus").textContent="Bu brauzerdə bildiriş dəstəyi yoxdur";return}$("pushStatus").textContent=Notification.permission==='granted'?"Bildirişlər aktivdir":Notification.permission==='denied'?"Bildirişlər bloklanıb":"Bildirişlər aktiv deyil";if($("adminPushStatus"))$("adminPushStatus").textContent=$("pushStatus").textContent}catch{}}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function enablePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)){alert("Bu brauzerdə Push bildirişləri dəstəklənmir");return}const key=(await api("/push/public-key")).publicKey;if(!key){alert("VAPID açarı Render-də yoxdur");return}const permission=await Notification.requestPermission();if(permission!=="granted"){alert("Bildiriş icazəsi verilmədi");return}const reg=await navigator.serviceWorker.register('/service-worker.js');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(key)});await api("/push/subscribe",{method:"POST",body:JSON.stringify(sub.toJSON())});await pushStatus();alert("Bildirişlər aktiv edildi!")}catch(e){alert("Push xətası: "+e.message)}}
load();setInterval(load,15000);
</script>
</body></html>
