<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AliScore</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    /* ===== АНИМАЦИЯ ВХОДА НА САЙТ ===== */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0b1220;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: introOut 0.8s ease 2.2s forwards;
    }

    .intro-content {
      text-align: center;
      animation: introLogo 1.2s ease;
    }

    .intro-ball {
      font-size: 75px;
      display: inline-block;
      animation: ballMove 0.8s ease-in-out infinite alternate;
    }

    .intro-title {
      color: white;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 10px;
    }

    .intro-line {
      width: 0;
      height: 3px;
      background: white;
      margin: 12px auto 0;
      animation: lineMove 1.2s ease forwards;
    }

    @keyframes introLogo {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes ballMove {
      from {
        transform: translateY(0) rotate(-12deg);
      }
      to {
        transform: translateY(-18px) rotate(12deg);
      }
    }

    @keyframes lineMove {
      from {
        width: 0;
      }
      to {
        width: 150px;
      }
    }

    @keyframes introOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* ===== ОСНОВНОЙ САЙТ ===== */

    header {
      background: #0b1220;
      color: white;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      cursor: pointer;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav button {
      border: 0;
      background: rgba(255,255,255,0.1);
      color: white;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    nav button:hover {
      background: rgba(255,255,255,0.2);
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .hero {
      background: white;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 35px;
    }

    .hero p {
      margin: 0;
      color: #6b7280;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: sectionIn 0.4s ease;
    }

    @keyframes sectionIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    /* ===== КОМАНДЫ ===== */

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .team-card {
      background: white;
      border-radius: 15px;
      padding: 22px 15px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
      transition: transform .2s, box-shadow .2s;
    }

    .team-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .team-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .team-name {
      font-weight: 800;
      font-size: 18px;
    }

    /* ===== ТАБЛИЦА ===== */

    .table-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      padding: 13px 10px;
      text-align: center;
      border-bottom: 1px solid #edf0f3;
    }

    th {
      background: #0b1220;
      color: white;
      font-size: 14px;
    }

    td:nth-child(2) {
      text-align: left;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    /* ===== МАТЧИ ===== */

    .match {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .match-date {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .match-team {
      font-weight: 800;
    }

    .match-team.home {
      text-align: right;
    }

    .match-score {
      font-size: 24px;
      font-weight: 900;
      min-width: 70px;
      text-align: center;
    }

    .match-team.away {
      text-align: left;
    }

    /* ===== ADMIN ===== */

    .admin-box {
      max-width: 700px;
      margin: auto;
    }

    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d8dde5;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 9px 0 5px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .grid-6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      margin-top: 10px;
    }

    .btn-main {
      background: #0b1220;
      color: white;
    }

    .btn-edit {
      background: #e8eefc;
      color: #173d8f;
    }

    .btn-delete {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-logout {
      background: #f3f4f6;
      color: #111827;
    }

    .admin-team {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .admin-match {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 10px;
      border-radius: 9px;
      margin-top: 10px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    footer {
      text-align: center;
      color: #6b7280;
      padding: 25px;
    }

    @media (max-width: 650px) {
      .header-inner {
        flex-direction: column;
      }

      nav {
        justify-content: center;
      }

      .hero h1 {
        font-size: 28px;
      }

      .grid-2,
      .grid-3,
      .grid-6 {
        grid-template-columns: 1fr 1fr;
      }

      .intro-title {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <!-- ===== АНИМАЦИЯ ПРИ ВХОДЕ НА САЙТ ===== -->

  <div id="intro">
    <div class="intro-content">
      <div class="intro-ball">⚽</div>
      <div class="intro-title">AliScore</div>
      <div class="intro-line"></div>
    </div>
  </div>

  <!-- ===== HEADER ===== -->

  <header>
    <div class="header-inner">

      <div class="logo" onclick="goHome()">
        ⚽ AliScore
      </div>

      <nav>
        <button onclick="goHome()">Ana səhifə</button>
        <button onclick="showTeams()">Komandalar</button>
        <button onclick="showTable()">Turnir cədvəli</button>
        <button onclick="showMatches()">Matçlar</button>
        <button onclick="showAdmin()">Admin</button>
      </nav>

    </div>
  </header>

  <main>

    <!-- ===== HOME ===== -->

    <section id="home" class="section active">

      <div class="hero">
        <h1>⚽ AliScore</h1>
        <p>Futbol turnirinin rəsmi nəticələri</p>
      </div>

      <div class="card">
        <h2>Turnir</h2>
        <p>Komandalar, turnir cədvəli və matç nəticələri.</p>

        <button class="btn btn-main" onclick="showTable()">
          Turnir cədvəlinə bax
        </button>
      </div>

    </section>

    <!-- ===== TEAMS ===== -->

    <section id="teams" class="section">

      <div class="card">
        <h2>Komandalar</h2>
        <div id="teamsGrid" class="teams-grid"></div>
      </div>

    </section>

    <!-- ===== TABLE ===== -->

    <section id="table" class="section">

      <div class="card">
        <h2>Turnir cədvəli</h2>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>#</th>
                <th>Komanda</th>
                <th>O</th>
                <th>Q</th>
                <th>B</th>
                <th>M</th>
                <th>AV</th>
                <th>X</th>
              </tr>
            </thead>

            <tbody id="tableBody"></tbody>

          </table>

        </div>
      </div>

    </section>

    <!-- ===== MATCHES ===== -->

    <section id="matches" class="section">

      <div class="card">
        <h2>Matçlar</h2>
        <div id="matchesList"></div>
      </div>

    </section>

    <!-- ===== ADMIN LOGIN ===== -->

    <section id="admin" class="section">

      <div id="loginBox" class="admin-box">

        <div class="card">

          <h2>Admin</h2>

          <label>Şifrə</label>

          <input
            id="adminPassword"
            type="password"
            placeholder="Admin şifrəsi"
          >

          <button class="btn btn-main" onclick="login()">
            Daxil ol
          </button>

          <div id="loginMessage" class="message error"></div>

        </div>

      </div>

      <!-- ===== ADMIN PANEL ===== -->

      <div id="adminPanel" class="admin-box hidden">

        <div class="card">

          <h2>Admin paneli</h2>

          <button class="btn btn-logout" onclick="logout()">
            Çıxış
          </button>

        </div>

        <!-- TEAM MANAGEMENT -->

        <div class="card">

          <h2>Komandaları idarə et</h2>

          <div id="adminTeams"></div>

        </div>

        <!-- ADD TEAM -->

        <div class="card">

          <h2>Yeni komanda</h2>

          <label>Komanda adı</label>
          <input id="newTeamName" placeholder="Komanda adı">

          <div class="grid-6">

            <div>
              <label>O</label>
              <input id="newPlayed" type="number" value="0">
            </div>

            <div>
              <label>Q</label>
              <input id="newWins" type="number" value="0">
            </div>

            <div>
              <label>B</label>
              <input id="newDraws" type="number" value="0">
            </div>

            <div>
              <label>M</label>
              <input id="newLosses" type="number" value="0">
            </div>

            <div>
              <label>AV</label>
              <input id="newGoalDifference" type="number" value="0">
            </div>

            <div>
              <label>X</label>
              <input id="newPoints" type="number" value="0">
            </div>

          </div>

          <button class="btn btn-main" onclick="addTeam()">
            + Komanda əlavə et
          </button>

        </div>

        <!-- ADD MATCH -->

        <div class="card">

          <h2>Yeni matç</h2>

          <label>Tarix</label>
          <input id="matchDate" type="date">

          <div class="grid-2">

            <div>
              <label>Ev sahibi</label>
              <select id="homeTeam"></select>
            </div>

            <div>
              <label>Qonaq</label>
              <select id="awayTeam"></select>
            </div>

          </div>

          <div class="grid-2">

            <div>
              <label>Ev sahibi hesabı</label>
              <input id="homeScore" type="number" min="0" value="0">
            </div>

            <div>
              <label>Qonaq hesabı</label>
              <input id="awayScore" type="number" min="0" value="0">
            </div>

          </div>

          <button class="btn btn-main" onclick="addMatch()">
            + Matç əlavə et
          </button>

          <div id="matchMessage" class="message"></div>

        </div>

        <!-- MATCH MANAGEMENT -->

        <div class="card">

          <h2>Matçları idarə et</h2>

          <div id="adminMatches"></div>

        </div>

      </div>

    </section>

  </main>

  <footer>
    AliScore © 2026
  </footer>

  <script>

    let teams = [];
    let matches = [];

    /* =========================
       API
    ========================= */

    async function loadTeams() {

      try {

        const response = await fetch("/api/teams");

        if (!response.ok) {
          throw new Error("Teams error");
        }

        teams = await response.json();

        renderTeams();
        renderTable();
        fillTeamSelects();
        renderAdminTeams();

      } catch (error) {

        console.error(error);

      }

    }

    async function loadMatches() {

      try {

        const response = await fetch("/api/matches");

        if (!response.ok) {
          throw new Error("Matches error");
        }

        matches = await response.json();

        renderMatches();
        renderAdminMatches();

      } catch (error) {

        console.error(error);

      }

    }

    /* =========================
       NAVIGATION
    ========================= */

    function hideSections() {

      document.querySelectorAll(".section").forEach(section => {
        section.classList.remove("active");
      });

    }

    function goHome() {

      hideSections();

      document.getElementById("home").classList.add("active");

    }

    function showTeams() {

      hideSections();

      document.getElementById("teams").classList.add("active");

      loadTeams();

    }

    function showTable() {

      hideSections();

      document.getElementById("table").classList.add("active");

      loadTeams();

    }

    function showMatches() {

      hideSections();

      document.getElementById("matches").classList.add("active");

      loadMatches();

    }

    async function showAdmin() {

      hideSections();

      document.getElementById("admin").classList.add("active");

      await checkAdmin();

    }

    /* =========================
       TEAMS
    ========================= */

    function renderTeams() {

      const container = document.getElementById("teamsGrid");

      if (!teams.length) {

        container.innerHTML = "<p>Komanda yoxdur.</p>";

        return;

      }

      container.innerHTML = teams.map(team => `

        <div class="team-card">

          <div class="team-icon">⚽</div>

          <div class="team-name">
            ${escapeHtml(team.name)}
          </div>

        </div>

      `).join("");

    }

    function renderTable() {

      const body = document.getElementById("tableBody");

      if (!teams.length) {

        body.innerHTML = `
          <tr>
            <td colspan="8">Komanda yoxdur.</td>
          </tr>
        `;

        return;

      }

      body.innerHTML = teams.map((team, index) => `

        <tr>

          <td>${index + 1}</td>

          <td>${escapeHtml(team.name)}</td>

          <td>${Number(team.played || 0)}</td>

          <td>${Number(team.wins || 0)}</td>

          <td>${Number(team.draws || 0)}</td>

          <td>${Number(team.losses || 0)}</td>

          <td>${Number(team.goal_difference || 0)}</td>

          <td><strong>${Number(team.points || 0)}</strong></td>

        </tr>

      `).join("");

    }

    /* =========================
       MATCHES
    ========================= */

    function getTeamName(id) {

      const team = teams.find(t => Number(t.id) === Number(id));

      return team ? team.name : "Naməlum komanda";

    }

    function renderMatches() {

      const container = document.getElementById("matchesList");

      if (!matches.length) {

        container.innerHTML = `
          <p>Hələ matç yoxdur.</p>
        `;

        return;

      }

      container.innerHTML = matches.map(match => `

        <div class="match">

          <div class="match-date">
            ${escapeHtml(match.match_date || "")}
          </div>

          <div class="match-row">

            <div class="match-team home">
              ${escapeHtml(getTeamName(match.home_team_id))}
            </div>

            <div class="match-score">
              ${match.home_score} : ${match.away_score}
            </div>

            <div class="match-team away">
              ${escapeHtml(getTeamName(match.away_team_id))}
            </div>

          </div>

        </div>

      `).join("");

    }

    /* =========================
       TEAM SELECTS
    ========================= */

    function fillTeamSelects() {

      const home = document.getElementById("homeTeam");
      const away = document.getElementById("awayTeam");

      const options = teams.map(team => `
        <option value="${team.id}">
          ${escapeHtml(team.name)}
        </option>
      `).join("");

      home.innerHTML = options;
      away.innerHTML = options;

      if (teams.length > 1) {
        away.value = teams[1].id;
      }

    }

    /* =========================
       ADMIN LOGIN
    ========================= */

    async function login() {

      const password =
        document.getElementById("adminPassword").value;

      const message =
        document.getElementById("loginMessage");

      try {

        const response = await fetch("/api/admin/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            password
          })

        });

        const data = await response.json();

        if (!response.ok) {

          message.textContent =
            data.error || "Şifrə yanlışdır.";

          message.style.display = "block";

          return;

        }

        message.style.display = "none";

        document.getElementById("loginBox")
          .classList.add("hidden");

        document.getElementById("adminPanel")
          .classList.remove("hidden");

        await loadTeams();
        await loadMatches();

      } catch (error) {

        message.textContent = "Xəta baş verdi.";
        message.style.display = "block";

      }

    }

    async function checkAdmin() {

      try {

        const response = await fetch("/api/admin/me");

        if (response.ok) {

          document.getElementById("loginBox")
            .classList.add("hidden");

          document.getElementById("adminPanel")
            .classList.remove("hidden");

          await loadTeams();
          await loadMatches();

        } else {

          document.getElementById("loginBox")
            .classList.remove("hidden");

          document.getElementById("adminPanel")
            .classList.add("hidden");

        }

      } catch (error) {

        console.error(error);

      }

    }

    async function logout() {

      await fetch("/api/admin/logout", {
        method: "POST"
      });

      document.getElementById("loginBox")
        .classList.remove("hidden");

      document.getElementById("adminPanel")
        .classList.add("hidden");

      document.getElementById("adminPassword").value = "";

    }

    /* =========================
       ADMIN TEAMS
       ========================= */

    function renderAdminTeams() {

      const container =
        document.getElementById("adminTeams");

      if (!teams.length) {

        container.innerHTML =
          "<p>Komanda yoxdur.</p>";

        return;

      }

      container.innerHTML = teams.map(team => `

        <div class="admin-team">

          <label>Komanda adı</label>

          <input
            id="team-name-${team.id}"
            value="${escapeAttribute(team.name)}"
          >

          <div class="grid-6">

            <div>
              <label>O</label>
              <input
                id="played-${team.id}"
                type="number"
                value="${Number(team.played || 0)}"
              >
            </div>

            <div>
              <label>Q</label>
              <input
                id="wins-${team.id}"
                type="number"
                value="${Number(team.wins || 0)}"
              >
            </div>

            <div>
              <label>B</label>
              <input
                id="draws-${team.id}"
                type="number"
                value="${Number(team.draws || 0)}"
              >
            </div>

            <div>
              <label>M</label>
              <input
                id="losses-${team.id}"
                type="number"
                value="${Number(team.losses || 0)}"
              >
            </div>

            <div>
              <label>AV</label>
              <input
                id="goal-difference-${team.id}"
                type="number"
                value="${Number(team.goal_difference || 0)}"
              >
            </div>

            <div>
              <label>X</label>
              <input
                id="points-${team.id}"
                type="number"
                value="${Number(team.points || 0)}"
              >
            </div>

          </div>

          <button
            class="btn btn-edit"
            onclick="saveTeam(${team.id})"
          >
            Yadda saxla
          </button>

          <button
            class="btn btn-delete"
            onclick="deleteTeam(${team.id})"
          >
            Sil
          </button>

        </div>

      `).join("");

    }

    async function saveTeam(id) {

      const data = {

        name:
          document.getElementById(`team-name-${id}`).value,

        played:
          Number(document.getElementById(`played-${id}`).value),

        wins:
          Number(document.getElementById(`wins-${id}`).value),

        draws:
          Number(document.getElementById(`draws-${id}`).value),

        losses:
          Number(document.getElementById(`losses-${id}`).value),

        goal_difference:
          Number(
            document.getElementById(`goal-difference-${id}`).value
          ),

        points:
          Number(document.getElementById(`points-${id}`).value)

      };

      try {

        const response = await fetch(`/api/teams/${id}`, {

          method: "PUT",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(data)

        });

        const result = await response.json();

        if (!response.ok) {

          alert(result.error || "Yadda saxlamaq alınmadı.");

          return;

        }

        alert("Komanda məlumatları yadda saxlanıldı.");

        await loadTeams();

      } catch (error) {

        alert("Xəta baş verdi.");

      }

    }

    async function addTeam() {

      const name =
        document.getElementById("newTeamName").value.trim();

      if (!name) {

        alert("Komanda adını yaz.");

        return;

      }

      const data = {

        name,

        played:
          Number(document.getElementById("newPlayed").value || 0),

        wins:
          Number(document.getElementById("newWins").value || 0),

        draws:
          Number(document.getElementById("newDraws").value || 0),

        losses:
          Number(document.getElementById("newLosses").value || 0),

        goal_difference:
          Number(
            document.getElementById("newGoalDifference").value || 0
          ),

        points:
          Number(document.getElementById("newPoints").value || 0)

      };

      try {

        const response = await fetch("/api/teams", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(data)

        });

        const result = await response.json();

        if (!response.ok) {

          alert(result.error || "Komanda əlavə olunmadı.");

          return;

        }

        document.getElementById("newTeamName").value = "";

        await loadTeams();

        alert("Komanda əlavə edildi.");

      } catch (error) {

        alert("Xəta baş verdi.");

      }

    }

    async function deleteTeam(id) {

      if (!confirm("Bu komandanı silmək istəyirsən?")) {
        return;
      }

      try {

        const response =
          await fetch(`/api/teams/${id}`, {
            method: "DELETE"
          });

        const result = await response.json();

        if (!response.ok) {

          alert(result.error || "Komanda silinmədi.");

          return;

        }

        await loadTeams();
        await loadMatches();

      } catch (error) {

        alert("Xəta baş verdi.");

      }

    }

    /* =========================
       ADMIN MATCHES
       ========================= */

    function renderAdminMatches() {

      const container =
        document.getElementById("adminMatches");

      if (!matches.length) {

        container.innerHTML =
          "<p>Hələ matç yoxdur.</p>";

        return;

      }

      container.innerHTML = matches.map(match => `

        <div class="admin-match">

          <strong>
            ${escapeHtml(getTeamName(match.home_team_id))}
            ${match.home_score}
            :
            ${match.away_score}
            ${escapeHtml(getTeamName(match.away_team_id))}
          </strong>

          <div style="color:#6b7280;margin-top:6px;">
            ${escapeHtml(match.match_date || "")}
          </div>

          <button
            class="btn btn-edit"
            onclick="editMatch(${match.id})"
          >
            Dəyiş
          </button>

          <button
            class="btn btn-delete"
            onclick="deleteMatch(${match.id})"
          >
            Sil
          </button>

        </div>

      `).join("");

    }

    async function addMatch() {

      const date =
        document.getElementById("matchDate").value;

      const homeTeam =
        Number(document.getElementById("homeTeam").value);

      const awayTeam =
        Number(document.getElementById("awayTeam").value);

      const homeScore =
        Number(document.getElementById("homeScore").value);

      const awayScore =
        Number(document.getElementById("awayScore").value);

      const message =
        document.getElementById("matchMessage");

      if (!date) {

        showMatchMessage("Tarix seç.", true);

        return;

      }

      if (!homeTeam || !awayTeam) {

        showMatchMessage("İki komanda seç.", true);

        return;

      }

      if (homeTeam === awayTeam) {

        showMatchMessage(
          "Eyni komandanı iki dəfə seçmək olmaz.",
          true
        );

        return;

      }

      if (
        homeScore < 0 ||
        awayScore < 0 ||
        !Number.isFinite(homeScore) ||
        !Number.isFinite(awayScore)
      ) {

        showMatchMessage("Hesab düzgün deyil.", true);

        return;

      }

      try {

        const response = await fetch("/api/matches", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            match_date: date,

            home_team_id: homeTeam,

            away_team_id: awayTeam,

            home_score: homeScore,

            away_score: awayScore

          })

        });

        const result = await response.json();

        if (!response.ok) {

          showMatchMessage(
            result.error || "Matç əlavə olunmadı.",
            true
          );

          return;

        }

        showMatchMessage(
          "Matç uğurla əlavə edildi.",
          false
        );

        document.getElementById("homeScore").value = 0;
        document.getElementById("awayScore").value = 0;

        await loadMatches();

      } catch (error) {

        console.error(error);

        showMatchMessage(
          "Xəta baş verdi.",
          true
        );

      }

    }

    function showMatchMessage(text, error) {

      const message =
        document.getElementById("matchMessage");

      message.textContent = text;

      message.className =
        "message " + (error ? "error" : "success");

      message.style.display = "block";

    }

    async function editMatch(id) {

      const match =
        matches.find(m => Number(m.id) === Number(id));

      if (!match) return;

      const date =
        prompt(
          "Tarix:",
          match.match_date || ""
        );

      if (date === null) return;

      const homeScore =
        prompt(
          "Ev sahibi hesabı:",
          match.home_score
        );

      if (homeScore === null) return;

      const awayScore =
        prompt(
          "Qonaq hesabı:",
          match.away_score
        );

      if (awayScore === null) return;

      const hs = Number(homeScore);
      const as = Number(awayScore);

      if (
        !Number.isFinite(hs) ||
        !Number.isFinite(as) ||
        hs < 0 ||
        as < 0
      ) {

        alert("Hesab düzgün deyil.");

        return;

      }

      try {

        const response = await fetch(`/api/matches/${id}`, {

          method: "PUT",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            match_date: date,

            home_team_id: match.home_team_id,

            away_team_id: match.away_team_id,

            home_score: hs,

            away_score: as

          })

        });

        const result = await response.json();

        if (!response.ok) {

          alert(result.error || "Matç dəyişdirilmədi.");

          return;

        }

        await loadMatches();

        alert("Matç dəyişdirildi.");

      } catch (error) {

        alert("Xəta baş verdi.");

      }

    }

    async function deleteMatch(id) {

      if (!confirm("Bu matçı silmək istəyirsən?")) {
        return;
      }

      try {

        const response =
          await fetch(`/api/matches/${id}`, {
            method: "DELETE"
          });

        const result = await response.json();

        if (!response.ok) {

          alert(result.error || "Matç silinmədi.");

          return;

        }

        await loadMatches();

      } catch (error) {

        alert("Xəta baş verdi.");

      }

    }

    /* =========================
       SECURITY / HTML
       ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function escapeAttribute(value) {

      return escapeHtml(value);

    }

    /* =========================
       START
       ========================= */

    document.addEventListener("DOMContentLoaded", async () => {

      await loadTeams();
      await loadMatches();

    });

  </script>

</body>
